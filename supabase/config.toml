project_id = "agendaservicos"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://agendaserv.zarpa.tech"]
jwt_expiry = 3600
enable_signup = true

# Login por celular. Na Fase 2 o código passa a ser entregue por WhatsApp (hook "Send SMS" -> Edge Function).
[auth.sms]
enable_signup = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "5MiB"
