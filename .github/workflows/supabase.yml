name: Publicar no Supabase

# Aplica as migrations (e, a partir da Fase 2, as Edge Functions) no projeto Supabase do AgendaServ.
# Configure no GitHub (Settings → Secrets and variables → Actions):
#   Secrets:   SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens) e SUPABASE_DB_PASSWORD
#   Variables: SUPABASE_PROJECT_REF (o id do projeto, aparece na URL do dashboard)
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/functions/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency: supabase-deploy

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Conferir configuração
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Supabase ainda não configurado (SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF). Pulando."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ok == 'true'
        with:
          version: 3.0.0
      - name: Banco (migrations)
        if: steps.cfg.outputs.ok == 'true'
        run: supabase db push --remote="$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Edge Functions
        if: steps.cfg.outputs.ok == 'true' && hashFiles('supabase/functions/**') != ''
        run: supabase functions deploy --remote="$PROJECT_REF" --use-api --yes
